<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | ReuseMart</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
.scroll-progress {
  position: fixed;
  top: 0;
  left: 0;
  height: 3px;
  width: 0%;
  background: linear-gradient(90deg, #27ae60, #2ecc71);
  z-index: 9999;
  transition: width 0.05s linear;
  box-shadow: 0 0 8px rgba(39, 174, 96, 0.6);
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #27ae60, #2ecc71);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Glass Card */
.container {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    padding: 35px;
    border-radius: 20px;
    width: 350px;
    color: white;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
}
/* ── SCROLL PROGRESS ── */
.scroll-progress {
  position: fixed; top: 0; left: 0; height: 3px; width: 0%;
  background: linear-gradient(90deg, var(--green), var(--green-light));
  z-index: 9999; transition: width 0.05s linear;
  box-shadow: 0 0 8px rgba(39,174,96,0.6);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: linear-gradient(135deg, #d4f5e9, #f4f8f6);
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  overflow-x: hidden;
}


/* Headings */
h2 {
    margin-bottom: 20px;
    font-weight: 600;
}

/* Input */
.input-group {
    position: relative;
    margin-bottom: 15px;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    outline: none;
}

/* Toggle Password */
.toggle {
    position: absolute;
    right: 10px;
    top: 12px;
    cursor: pointer;
    font-size: 12px;
    color: #555;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: white;
    color: #27ae60;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
}

/* Switch */
.switch {
    margin-top: 15px;
    font-size: 14px;
    cursor: pointer;
    text-decoration: underline;
}

/* Error */
.error {
    color: #ffdddd;
    font-size: 13px;
    margin-top: 5px;
}

/* Hidden */
.hidden {
    display: none;
}
@media screen and (max-width: 600px) {
  .container {
    width: 100%;
    display: block; /* Stacks elements */
  }
}

</style>
</head>

<body>

<div class="container">

    <!-- LOGIN -->
    <div id="loginBox">
        <h2>Welcome Back 👋</h2>

        <div class="input-group">
            <input type="text" id="loginUser" placeholder="Username">
        </div>

        <div class="input-group">
            <input type="password" id="loginPass" placeholder="Password">
            <span class="toggle" onclick="togglePassword('loginPass')">Show</span>
        </div>

        <button onclick="login()">Login</button>
        <p class="error" id="loginError"></p>

        <p class="switch" onclick="showSignup()">Create an account</p>
    </div>

    <!-- SIGNUP -->
    <div id="signupBox" class="hidden">
        <h2>Create Account ✨</h2>

        <div class="input-group">
            <input type="text" id="signupUser" placeholder="Username">
        </div>

        <div class="input-group">
            <input type="password" id="signupPass" placeholder="Password">
            <span class="toggle" onclick="togglePassword('signupPass')">Show</span>
        </div>

        <button onclick="signup()">Sign Up</button>
        <p class="error" id="signupError"></p>

        <p class="switch" onclick="showLogin()">Already have an account?</p>
    </div>

</div>

<script>
// Switch Views
function showSignup() {
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("signupBox").classList.remove("hidden");
}

function showLogin() {
    document.getElementById("signupBox").classList.add("hidden");
    document.getElementById("loginBox").classList.remove("hidden");
}

// Toggle Password
function togglePassword(id) {
    let input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}

const API_BASE = (window.location.protocol === 'file:' || window.location.origin === 'null')
    ? 'http://localhost:3000'
    : window.location.origin;

// SIGNUP
async function signup() {
    let username = document.getElementById("signupUser").value.trim();
    let password = document.getElementById("signupPass").value.trim();

    if (username === "" || password === "") {
        document.getElementById("signupError").innerText = "Please fill all fields.";
        return;
    }

    try {
        const response = await fetch(`${API_BASE}/api/signup`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();
        if (!response.ok) {
            document.getElementById("signupError").innerText = data.message || 'Signup failed.';
            return;
        }

        alert(data.message || 'Account created successfully!');
        showLogin();
    } catch (error) {
        document.getElementById("signupError").innerText = 'Unable to contact the server.';
        console.error(error);
    }
}

// LOGIN
async function login() {
    let username = document.getElementById("loginUser").value.trim();
    let password = document.getElementById("loginPass").value.trim();

    if (username === "" || password === "") {
        document.getElementById("loginError").innerText = "Please fill all fields.";
        return;
    }

    try {
        const response = await fetch(`${API_BASE}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();
        if (!response.ok || !data.success) {
            document.getElementById("loginError").innerText = data.message || 'Invalid username or password.';
            return;
        }

        localStorage.setItem("loggedInUser", username);
        window.location.href = "home.html";
    } catch (error) {
        document.getElementById("loginError").innerText = 'Unable to contact the server.';
        console.error(error);
    }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | ReuseMart</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #27ae60, #2ecc71);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Glass Card */
.container {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    padding: 35px;
    border-radius: 20px;
    width: 350px;
    color: white;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
}

/* Headings */
h2 {
    margin-bottom: 20px;
    font-weight: 600;
}

/* Input */
.input-group {
    position: relative;
    margin-bottom: 15px;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    outline: none;
}

/* Toggle Password */
.toggle {
    position: absolute;
    right: 10px;
    top: 12px;
    cursor: pointer;
    font-size: 12px;
    color: #555;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: white;
    color: #27ae60;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
}

/* Switch */
.switch {
    margin-top: 15px;
    font-size: 14px;
    cursor: pointer;
    text-decoration: underline;
}

/* Error */
.error {
    color: #ffdddd;
    font-size: 13px;
    margin-top: 5px;
}

/* Hidden */
.hidden {
    display: none;
}
@media screen and (max-width: 600px) {
  .container {
    width: 100%;
    display: block; /* Stacks elements */
  }
}

</style>
</head>

<body>

<div class="container">

    <!-- LOGIN -->
    <div id="loginBox">
        <h2>Welcome Back 👋</h2>

        <div class="input-group">
            <input type="text" id="loginUser" placeholder="Username">
        </div>

        <div class="input-group">
            <input type="password" id="loginPass" placeholder="Password">
            <span class="toggle" onclick="togglePassword('loginPass')">Show</span>
        </div>

        <button onclick="login()">Login</button>
        <p class="error" id="loginError"></p>

        <p class="switch" onclick="showSignup()">Create an account</p>
    </div>

    <!-- SIGNUP -->
    <div id="signupBox" class="hidden">
        <h2>Create Account ✨</h2>

        <div class="input-group">
            <input type="text" id="signupUser" placeholder="Username">
        </div>

        <div class="input-group">
            <input type="password" id="signupPass" placeholder="Password">
            <span class="toggle" onclick="togglePassword('signupPass')">Show</span>
        </div>

        <button onclick="signup()">Sign Up</button>
        <p class="error" id="signupError"></p>

        <p class="switch" onclick="showLogin()">Already have an account?</p>
    </div>

</div>

<script>
// Switch Views
function showSignup() {
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("signupBox").classList.remove("hidden");
}

function showLogin() {
    document.getElementById("signupBox").classList.add("hidden");
    document.getElementById("loginBox").classList.remove("hidden");
}

// Toggle Password
function togglePassword(id) {
    let input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}

// SIGNUP
function signup() {
    let username = document.getElementById("signupUser").value.trim();
    let password = document.getElementById("signupPass").value.trim();

    if(username === "" || password === "") {
        document.getElementById("signupError").innerText = "Please fill all fields";
        return;
    }

    let users = JSON.parse(localStorage.getItem("users")) || [];

    let exists = users.find(u => u.username === username);
    if(exists) {
        document.getElementById("signupError").innerText = "User already exists";
        return;
    }

    users.push({ username, password });
    localStorage.setItem("users", JSON.stringify(users));

    alert("Account created successfully!");
    showLogin();
}

// LOGIN
function login() {
    let username = document.getElementById("loginUser").value.trim();
    let password = document.getElementById("loginPass").value.trim();

    let users = JSON.parse(localStorage.getItem("users")) || [];

    let validUser = users.find(
        u => u.username === username && u.password === password
    );

    if(validUser) {
        localStorage.setItem("loggedInUser", username);
        window.location.href = "home.html";
    } else {
        document.getElementById("loginError").innerText = "Invalid username or password";
    }
}
</script>
<script src="login.js"></script>

</body>
</html>
